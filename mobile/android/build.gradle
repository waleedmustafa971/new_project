buildscript {
    ext {
        buildToolsVersion = "35.0.0"
      //  minSdkVersion = 24
      //  minSdkVersion = 26
        compileSdkVersion = 35
        targetSdkVersion = 35
       // ndkVersion = "27.1.12297006"
        ndkVersion = "27.1.12297006"
       // minSdkVersion = 24
        kotlinVersion = "2.0.21"
        // "full" includes all filters like drawtext for your text overlays
        ffmpegKitPackage = "full"
        //kotlin_version = "1.9.20" // this added for react-native-audio-recorder-player
    
     //   ndkVersion = "27.1.12297006"
        cmakeVersion = "3.30.3"
        
        // Add this line for Skia/Video compatibility
        minSdkVersion = 26 // Skia Video requires API 26+
    
    }
   // RESTORE THIS: Gradle needs this to find the plugins mentioned in the error!
    repositories {
        google()
        mavenCentral()
       
    }
    
    dependencies {
        classpath 'com.google.gms:google-services:4.3.15' //firebase notfication
      //  classpath("com.android.tools.build:gradle")
        classpath("com.android.tools.build:gradle:8.1.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin") 
       // implementation "ly.img:camera:1.72.0"      
    }
}
apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        google()
        mavenCentral()
         maven {
            name "IMG.LY Artifactory"
            url "https://artifactory.img.ly/artifactory/maven"
            mavenContent {
                includeGroup("ly.img")
            }
        }
       
    }
}

