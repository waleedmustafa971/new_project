pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }

plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }

rootProject.name = 'messengeruae'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

include ':ffmpeg-helper' //for ffmpge

// camera-roll is autolinked (autolinkLibrariesFromCommand above); it must not
// also be included by hand. Both were present, which gave Gradle two projects
// over the same source directory -- ':@react-native-camera-roll_camera-roll'
// and ':react-native-camera-roll_camera-roll' -- and their codegen tasks then
// raced over the same output, failing the build with an implicit-dependency
// validation error.

include ':react-native-audio-recorder-player'
project(':react-native-audio-recorder-player').projectDir = new File(rootProject.projectDir, 	'../node_modules/react-native-audio-recorder-player/android')

include ':react-native-track-player'
project(':react-native-track-player').projectDir = new File(rootProject.projectDir, '../node_modules/react-native-track-player/android')
include ':react-native-documents-picker'
